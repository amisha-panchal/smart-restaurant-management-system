<!DOCTYPE html>
<html>
<head>
    <title>Book Table</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{
            background:#f5f7fb;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .card{
            width:100%;
            max-width:650px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#111827;
        }

        .subtitle{
            text-align:center;
            color:#6b7280;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#111827;
        }

        input,
        select{
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#ff6b35;
        }

        .row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .btn{
            width:100%;
            padding:15px;
            background:#ff6b35;
            color:white;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            margin-top:15px;
        }

        .btn:hover{
            opacity:.9;
        }

        .back-btn{
            display:inline-block;
            text-decoration:none;
            background:#111827;
            color:white;
            padding:10px 20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .error-box{
            background:#fee2e2;
            color:#dc2626;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
            font-weight:600;
        }

        .table-note{
            margin-top:8px;
            font-size:13px;
            color:#6b7280;
        }

        @media(max-width:768px){

            .row{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>
<body>

<div class="card">

    <a href="{% url 'reservation_list' %}" class="back-btn">
        ← Back
    </a>

    <h1>🍽️ Table Reservation</h1>

    <p class="subtitle">
        Reserve your table quickly and easily
    </p>

    {% if error %}
    <div class="error-box">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Customer Name</label>

            <input
                type="text"
                name="customer_name"
                placeholder="Enter customer name"
                required
            >

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >

        </div>

        <div class="row">

            <div class="form-group">

                <label>Guests</label>

                <input
                    type="number"
                    name="guests"
                    min="1"
                    placeholder="No. of guests"
                    required
                >

            </div>

            <div class="form-group">

                <label>Table Number</label>

                <select
                    name="table_number"
                    required
                >

                    <option value="">
                        Select Table
                    </option>

                    <option value="1">Table 1</option>
                    <option value="2">Table 2</option>
                    <option value="3">Table 3</option>
                    <option value="4">Table 4</option>
                    <option value="5">Table 5</option>
                    <option value="6">Table 6</option>
                    <option value="7">Table 7</option>
                    <option value="8">Table 8</option>
                    <option value="9">Table 9</option>
                    <option value="10">Table 10</option>
                    <option value="11">Table 11</option>
                    <option value="12">Table 12</option>
                    <option value="13">Table 13</option>
                    <option value="14">Table 14</option>
                    <option value="15">Table 15</option>
                    <option value="16">Table 16</option>
                    <option value="17">Table 17</option>
                    <option value="18">Table 18</option>
                    <option value="19">Table 19</option>
                    <option value="20">Table 20</option>

                </select>

                <p class="table-note">
                    Choose an available table.
                </p>

            </div>

        </div>

        <div class="form-group">

            <label>Reservation Date & Time</label>

            <input
                type="datetime-local"
                name="reservation_time"
                required
            >

        </div>

        <button type="submit" class="btn">
            📅 Confirm Reservation
        </button>

    </form>

</div>

</body>
</html>
