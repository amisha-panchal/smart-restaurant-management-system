{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Restaurant Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

         body{
         min-height:100vh;
         display:flex;
         justify-content:center;
         align-items:center;
         padding:20px;

         background-image:url('/static/image/auth.jpg');
         background-size:cover;
         background-position:center;
         background-repeat:no-repeat;
      }


        body::before{
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.55);
        }

        .login-card{
            position:relative;
            z-index:1;

            width:100%;
            max-width:450px;

            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.2);

            border-radius:25px;

            padding:40px 30px;

            box-shadow:0 8px 30px rgba(0,0,0,0.4);
        }

        .logo{
            text-align:center;
            font-size:60px;
            color:white;
        }

        .title{
            text-align:center;
            color:white;
            font-weight:700;
            margin-top:10px;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#ddd;
            margin-bottom:30px;
        }

        .input-group-text{
            background:white;
            border:none;
        }

        .form-control{
            height:50px;
            border:none;
        }

        .form-control:focus{
            box-shadow:none;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:10px;
            background:#ff6b35;
            color:white;
            font-size:18px;
            font-weight:600;
            transition:.3s;
        }

        .btn-login:hover{
            background:#e85a2a;
            transform:translateY(-2px);
        }

        .extra-links{
            display:flex;
            justify-content:space-between;
            margin-top:15px;
            flex-wrap:wrap;
        }

        .extra-links a{
            color:white;
            text-decoration:none;
            font-size:14px;
        }

        .extra-links a:hover{
            color:#ffb38a;
        }

        .remember{
            color:white;
        }

        .error{
            background:#ffdddd;
            color:red;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }

        @media(max-width:576px){

            .login-card{
                padding:30px 20px;
            }

            .logo{
                font-size:50px;
            }

            .title{
                font-size:28px;
            }
        }

    </style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        <i class="fa-solid fa-utensils"></i>
    </div>

    <h2 class="title">Smart Restaurant</h2>

    <p class="subtitle">
        Welcome Back 👋
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="input-group mb-3">

            <span class="input-group-text">
                <i class="fa fa-user"></i>
            </span>

            <input type="text"
                   class="form-control"
                   name="username"
                   placeholder="Username"
                   required>

        </div>

        <div class="input-group mb-3">

            <span class="input-group-text">
                <i class="fa fa-lock"></i>
            </span>

            <input type="password"
                   class="form-control"
                   name="password"
                   id="password"
                   placeholder="Password"
                   required>

            <span class="input-group-text"
                  onclick="togglePassword()"
                  style="cursor:pointer">

                <i class="fa-solid fa-eye" id="eyeIcon"></i>

            </span>

        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div class="form-check remember">

                <input class="form-check-input"
                       type="checkbox"
                       id="remember">

                <label class="form-check-label"
                       for="remember">

                    Remember Me

                </label>

            </div>

        </div>

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

    <div class="extra-links">

        <a href="{% url 'forgot_password' %}">
            Forgot Password?
        </a>

        <a href="{% url 'signup' %}">
            Create Account
        </a>

    </div>

</div>

<script>

function togglePassword(){

    let password =
        document.getElementById("password");

    let eye =
        document.getElementById("eyeIcon");

    if(password.type === "password"){

        password.type = "text";

        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");

    }else{

        password.type = "password";

        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}

</script>

</body>
</html>
{% comment %} <h2>Login</h2>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username">

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password">

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<a href="{% url 'forgot_password' %}">
    Forgot Password?
</a>

<br>

{{ error }} {% endcomment %}
