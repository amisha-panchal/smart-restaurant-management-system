<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Poppins,sans-serif;
    }

    body{
        background:#f5f7fb;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px;
    }

    .card{
        width:100%;
        max-width:650px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
        text-align:center;
        color:#111827;
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        color:#6b7280;
        margin-bottom:25px;
    }

    .form-group{
        margin-bottom:18px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#111827;
    }

    input{
        width:100%;
        padding:14px;
        border:1px solid #ddd;
        border-radius:10px;
        font-size:15px;
    }

    input:focus{
        outline:none;
        border-color:#ff6b35;
    }

    .btn{
        width:100%;
        padding:15px;
        background:#ff6b35;
        color:white;
        border:none;
        border-radius:12px;
        cursor:pointer;
        font-size:16px;
        font-weight:600;
        margin-top:10px;
    }

    .btn:hover{
        opacity:.9;
    }

    .back-btn{
        display:inline-block;
        text-decoration:none;
        background:#111827;
        color:white;
        padding:10px 20px;
        border-radius:10px;
        margin-bottom:20px;
    }

    .status-box{
        text-align:center;
        margin-bottom:25px;
    }

    .badge{
        padding:8px 18px;
        border-radius:20px;
        color:white;
        font-weight:600;
        font-size:14px;
    }

    .low{
        background:#ef4444;
    }

    .good{
        background:#10b981;
    }

</style>
```

</head>
<body>

<div class="card">

```
<a href="{% url 'inventory_list' %}" class="back-btn">
    ← Back
</a>

<h1>✏ Edit Inventory Item</h1>

<p class="subtitle">
    Update inventory details
</p>

<div class="status-box">

    {% if item.quantity <= item.minimum_stock %}

        <span class="badge low">
            Low Stock
        </span>

    {% else %}

        <span class="badge good">
            In Stock
        </span>

    {% endif %}

</div>

<form method="POST">

    {% csrf_token %}

    <div class="form-group">

        <label>Item Name</label>

        <input
            type="text"
            name="name"
            value="{{ item.name }}"
            required
        >

    </div>

    <div class="form-group">

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            value="{{ item.quantity }}"
            min="0"
            required
        >

    </div>

    <div class="form-group">

        <label>Unit</label>

        <input
            type="text"
            name="unit"
            value="{{ item.unit }}"
            required
        >

    </div>

    <div class="form-group">

        <label>Minimum Stock</label>

        <input
            type="number"
            name="minimum_stock"
            value="{{ item.minimum_stock }}"
            min="0"
            required
        >

    </div>

    <button type="submit" class="btn">
        Update Item
    </button>

</form>
```

</div>

</body>
</html>
