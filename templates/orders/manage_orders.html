<!DOCTYPE html>
<html>
<head>
<title>Manage Orders</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f8fafc;
    padding:30px;
}

.container{
    max-width:1300px;
    margin:auto;
}

h1{
    margin-bottom:25px;
}

table{
    width:100%;
    background:white;
    border-collapse:collapse;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

th{
    background:#0f172a;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #eee;
}

select{
    padding:8px;
    border-radius:8px;
}

button{
    background:#10b981;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>📦 Manage Orders</h1>

<table>

<tr>
<th>Order ID</th>
<th>Status</th>
<th>Total</th>
<th>Date</th>
<th>Update</th>
</tr>

{% for order in orders %}

<tr>

<td>#{{ order.id }}</td>

<td>{{ order.status }}</td>

<td>₹{{ order.total_amount }}</td>

<td>{{ order.created_at|date:"d M Y" }}</td>

<td>

<form method="POST"
action="{% url 'update_order_status' order.id %}">

{% csrf_token %}

<select name="status">

<option value="Pending">
Pending
</option>

<option value="Preparing">
Preparing
</option>

<option value="Ready">
Ready
</option>

<option value="Delivered">
Delivered
</option>

</select>

<button type="submit">
Update
</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
