{% load static %}
<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP</title>

    ```
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;

        background-image: url("/static/image/auth.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      body::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
      }

      .otp-card {
        position: relative;
        z-index: 1;

        width: 100%;
        max-width: 450px;

        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);

        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px;

        padding: 40px 30px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }

      .icon {
        text-align: center;
        font-size: 60px;
        color: white;
      }

      .title {
        text-align: center;
        color: white;
        font-weight: 700;
        margin-top: 10px;
      }

      .subtitle {
        text-align: center;
        color: #ddd;
        margin-bottom: 25px;
      }

      .input-group-text {
        background: white;
        border: none;
      }

      .form-control {
        height: 55px;
        border: none;
        text-align: center;
        font-size: 22px;
        letter-spacing: 5px;
        font-weight: 600;
      }

      .form-control:focus {
        box-shadow: none;
      }

      .btn-verify {
        width: 100%;
        height: 50px;
        border: none;
        border-radius: 10px;
        background: #ff6b35;
        color: white;
        font-size: 18px;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn-verify:hover {
        background: #e85a2a;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        text-align: center;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: white;
        text-decoration: none;
        font-weight: 600;
      }

      .back-link a:hover {
        color: #ffb38a;
      }
    </style>
    ```
  </head>
  <body>
    <div class="otp-card">
      ```
      <div class="icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <h2 class="title">Verify OTP</h2>

      <p class="subtitle">Enter the OTP sent to your email</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="input-group mb-4">
          <span class="input-group-text">
            <i class="fa-solid fa-key"></i>
          </span>

          <input
            type="text"
            name="otp"
            class="form-control"
            maxlength="6"
            placeholder="000000"
            required
          />
        </div>

        <button type="submit" class="btn-verify">Verify OTP</button>
      </form>

      <div class="back-link">
        <a href="{% url 'login' %}">
          <i class="fa-solid fa-arrow-left"></i>
          Back to Login
        </a>
      </div>
      ```
    </div>
  </body>
</html>
