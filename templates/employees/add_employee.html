<!DOCTYPE html>
<html>
<head>
<title>Add Employee</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#f4f7fb,#eef2ff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.form-card{
    width:100%;
    max-width:850px;
    background:white;
    padding:40px;
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    color:#0f172a;
    font-size:42px;
}

.back-btn{
    text-decoration:none;
    background:#0f172a;
    color:white;
    padding:12px 24px;
    border-radius:12px;
    font-weight:600;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

.input-group input,
.input-group select{
    padding:14px;
    border:1px solid #dbe2ea;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-group input:focus,
.input-group select:focus{
    border-color:#ff6b35;
}

.full{
    grid-column:span 2;
}

.submit-btn{
    width:100%;
    border:none;
    padding:16px;
    margin-top:25px;
    border-radius:14px;
    background:#ff6b35;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(255,107,53,.35);
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:span 1;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

    .header h1{
        font-size:32px;
    }
}

</style>
</head>

<body>

<div class="form-card">

<div class="header">

<h1>👨‍🍳 Add Employee</h1>

<a href="{% url 'employee_list' %}" class="back-btn">
← Back
</a>

</div>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="input-group">
<label>Employee Name</label>
<input type="text" name="name" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text" name="phone" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" name="email" required>
</div>

<div class="input-group">
<label>Role</label>

<select name="role" required>
<option value="">Select Role</option>
<option value="Chef">Chef</option>
<option value="Waiter">Waiter</option>
<option value="Manager">Manager</option>
<option value="Cashier">Cashier</option>
</select>

</div>

<div class="input-group">
<label>Shift</label>

<select name="shift" required>
<option value="">Select Shift</option>
<option value="Morning">Morning</option>
<option value="Evening">Evening</option>
<option value="Night">Night</option>
</select>

</div>

<div class="input-group">
<label>Salary (₹)</label>
<input type="number" name="salary" required>
</div>

</div>

<button type="submit" class="submit-btn">
➕ Add Employee
</button>

</form>

</div>

</body>
</html>
